# =====================
# Perfil de pruebas — PostgreSQL aislado en Docker
# Requiere: docker compose -f docker-compose.local.yml up -d postgres
# Puerto 5433: ver el comentario de ports en docker-compose.local.yml (en Windows,
# 127.0.0.1:5432 suele estar ocupado por otro PostgreSQL, p. ej. vía WSL).
# Base dedicada: se crea/borra el esquema en cada ejecución.
# =====================
spring.datasource.url=jdbc:postgresql://localhost:5433/polleria_test
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt.secret=sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
internal.api-key=polleria-dev-internal-key

cors.allowed-origins=http://localhost:4200

# Evita llamadas de red reales durante las pruebas
notification.service.url=http://localhost:1
notification.service.internal-key=test

logging.level.com.sistema.polleria=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
