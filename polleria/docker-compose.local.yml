services:
  # ============================================================
  # Base de Datos PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16.6-alpine
    container_name: polleria-postgres
    restart: unless-stopped
    # Los microservicios y los contextos de Spring de las pruebas (cada uno con su pool de
    # Hikari) agotan las 100 conexiones por defecto.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      TZ: America/Lima
      POSTGRES_DB: ${POSTGRES_DB:-polleria}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      # 5433 es el puerto expuesto al host (JUnit/Maven y herramientas locales);
      # 127.0.0.1:5432 suele estar ocupado en Windows por otro proceso/PostgreSQL,
      # mientras los contenedores internos siguen conectando a postgres:5432 por la red Docker.
      - "127.0.0.1:5433:5432"
    volumes:
      - polleria_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-polleria}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - polleria-network

  # ============================================================
  # Administrador Visual de BD (Opcional - http://127.0.0.1:5050)
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: polleria-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@polleria.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Defina PGADMIN_DEFAULT_PASSWORD en .env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.1 Microservicio de Autenticación (:8081)
  # ============================================================
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: polleria-auth-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polleria}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80,http://localhost}
      MAX_FAILED_ATTEMPTS: 5
      BLOCK_DURATION_MINUTES: 15
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      TWO_FACTOR_EXPIRY_MINUTES: 5
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Defina INTERNAL_API_KEY en .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.2 & 1.3 Microservicio de Carta, Productos y Órdenes (:8082)
  # ============================================================
  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    container_name: polleria-orders-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polleria}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80,http://localhost}
      NOTIFICATION_URL: http://notification-service:3001
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:?Defina NOTIFICATION_API_KEY en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Defina INTERNAL_API_KEY en .env}
      AUTH_SERVICE_URL: http://auth-service:8081
      INCIDENT_SERVICE_URL: http://incident-service:8088
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env}
      MINIO_BUCKET_CATALOGO: ${MINIO_BUCKET_CATALOGO:-polleria-catalogo}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.4 Microservicio de Pagos (:8083)
  # ============================================================
  payments-service:
    build:
      context: .
      dockerfile: payments-service/Dockerfile
    container_name: polleria-payments-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polleria}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80,http://localhost}
      ORDERS_SERVICE_URL: http://orders-service:8082
      FINANCE_SERVICE_URL: http://finance-service:8087
      NOTIFICATION_URL: http://notification-service:3001
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:?Defina NOTIFICATION_API_KEY en .env}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_SANDBOX: ${MERCADOPAGO_SANDBOX:-true}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Defina INTERNAL_API_KEY en .env}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env}
    depends_on:
      postgres:
        condition: service_healthy
      orders-service:
        condition: service_started
    networks:
      - polleria-network

  # ============================================================
  # 1.5 Microservicio de Feedback y Reclamos (:8085)
  # ============================================================
  feedback-service:
    build:
      context: .
      dockerfile: feedback-service/Dockerfile
    container_name: polleria-feedback-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polleria}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80,http://localhost}
      ORDERS_SERVICE_URL: http://orders-service:8082
      PAYMENTS_SERVICE_URL: http://payments-service:8083
      FINANCE_SERVICE_URL: http://finance-service:8087
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Defina INTERNAL_API_KEY en .env}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env}
      MINIO_BUCKET_FEEDBACK: ${MINIO_BUCKET_FEEDBACK:-polleria-feedback}
    depends_on:
      postgres:
        condition: service_healthy
      payments-service:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.7 Microservicio de Finanzas y Caja (:8087)
  # ============================================================
  finance-service:
    build:
      context: .
      dockerfile: finance-service/Dockerfile
    container_name: polleria-finance-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polleria}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80,http://localhost}
      ORDERS_SERVICE_URL: http://orders-service:8082
      PAYMENTS_SERVICE_URL: http://payments-service:8083
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Defina INTERNAL_API_KEY en .env}
    depends_on:
      postgres:
        condition: service_healthy
      payments-service:
        condition: service_started
    networks:
      - polleria-network

  # ============================================================
  # 1.8 Microservicio de Incidentes y Resiliencia (:8088)
  # ============================================================
  incident-service:
    build:
      context: .
      dockerfile: incident-service/Dockerfile
    container_name: polleria-incident-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      PORT: 8088
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polleria}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80,http://localhost}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Defina INTERNAL_API_KEY en .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.9 Microservicio de Facturación Electrónica SUNAT (:8089)
  # ============================================================
  facturacion-sunat-service:
    build:
      context: .
      dockerfile: facturacion-sunat-service/Dockerfile
    container_name: polleria-facturacion-sunat-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      PORT: 8089
      TZ: America/Lima
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polleria}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80,http://localhost}
      FINANCE_SERVICE_URL: http://finance-service:8087
      ORDERS_SERVICE_URL: http://orders-service:8082
      SUNAT_URL: ${SUNAT_URL:-https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
      SUNAT_USUARIO_SOL: ${SUNAT_USUARIO_SOL:-MODDATOS}
      SUNAT_CLAVE_SOL: ${SUNAT_CLAVE_SOL:-moddatos}
      SUNAT_CERT_BASE64: ${SUNAT_CERT_BASE64:-}
      SUNAT_CERT_RUTA: ${SUNAT_CERT_RUTA:-/app/certificado/certificado-beta.p12}
      SUNAT_CERT_PASSWORD: ${SUNAT_CERT_PASSWORD:-}
      SUNAT_FIRMA_ALGORITMO: ${SUNAT_FIRMA_ALGORITMO:-SHA1}
      SUNAT_RUC: ${SUNAT_RUC:-20608945123}
      SUNAT_RAZON_SOCIAL: ${SUNAT_RAZON_SOCIAL:-POLLERIA SAN POLLO DE ICA S.A.C.}
      SUNAT_NOMBRE_COMERCIAL: ${SUNAT_NOMBRE_COMERCIAL:-POLLERIA SAN POLLO DE ICA}
      SUNAT_DIRECCION: ${SUNAT_DIRECCION:-AV. SAN MARTIN 456}
      SUNAT_UBIGEO: ${SUNAT_UBIGEO:-110101}
      SUNAT_DEPARTAMENTO: ${SUNAT_DEPARTAMENTO:-ICA}
      SUNAT_PROVINCIA: ${SUNAT_PROVINCIA:-ICA}
      SUNAT_DISTRITO: ${SUNAT_DISTRITO:-ICA}
    volumes:
      - ./facturacion-sunat-service/certificado:/app/certificado:ro
    depends_on:
      postgres:
        condition: service_healthy
      finance-service:
        condition: service_started
      orders-service:
        condition: service_started
    networks:
      - polleria-network

  # ============================================================
  # Fase 3 - Almacenamiento de comprobantes (S7)
  # API S3: http://127.0.0.1:9000 · Consola: http://127.0.0.1:9001
  # ============================================================
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: polleria-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - polleria_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polleria-network

  # ============================================================
  # Fase 3 - Notificaciones WhatsApp (:3001)
  # Primer arranque: `docker logs -f polleria-notification-service` y escanear el QR
  # ============================================================
  notification-service:
    build:
      context: ./notification-service
    container_name: polleria-notification-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: 3001
      TZ: America/Lima
      PUPPETEER_NO_SANDBOX: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polleria}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:?Defina NOTIFICATION_API_KEY en .env}
      WHATSAPP_RATE_LIMIT_MS: 10000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80,http://localhost}
      ORDERS_SERVICE_URL: http://orders-service:8082
      PAYMENTS_SERVICE_URL: http://payments-service:8083
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Defina INTERNAL_API_KEY en .env}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env}
      MINIO_BUCKET: ${MINIO_BUCKET_COMPROBANTES:-polleria-comprobantes}
    volumes:
      - polleria_whatsapp_session:/app/whatsapp-session
    shm_size: "1gb"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - polleria-network

volumes:
  polleria_postgres_data:
    name: polleria_local_postgres_data
  polleria_whatsapp_session:
    name: polleria_local_whatsapp_session
  polleria_minio_data:
    name: polleria_local_minio_data

networks:
  polleria-network:
    name: polleria_local_network
    driver: bridge
