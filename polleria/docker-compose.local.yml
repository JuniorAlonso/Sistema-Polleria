services:
  # ============================================================
  # Base de Datos PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: polleria-postgres
    restart: unless-stopped
    # Los 8 microservicios más los contextos de Spring de las pruebas (cada uno con su pool de
    # Hikari) agotan las 100 conexiones por defecto. Cuando eso pasa, las pruebas de integración
    # se saltan en silencio (`too many clients already`) y una suite roja parece verde.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      TZ: America/Lima
      POSTGRES_DB: polleria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      # 5433 es el puerto para pruebas locales desde el host (JUnit/Maven).
      # En muchas máquinas Windows, 127.0.0.1:5432 lo ocupa otro PostgreSQL (p. ej. vía WSL),
      # por lo que localhost:5432 no llega a este contenedor.
      - "5432:5432"
      - "5433:5432"
    volumes:
      - polleria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polleria"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - polleria-network

  # ============================================================
  # Administrador Visual de BD (Opcional - http://localhost:5050)
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: polleria-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.1 Microservicio de Autenticación (:8081)
  # ============================================================
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: polleria-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
      MAX_FAILED_ATTEMPTS: 5
      BLOCK_DURATION_MINUTES: 15
      MAIL_USERNAME: ${MAIL_USERNAME:-mitrufely.dev@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-nxlktmlztrpuqudc}
      TWO_FACTOR_EXPIRY_MINUTES: 5
      # orders-service checks and records sanctions here with X-Internal-Key.
      INTERNAL_API_KEY: sanpollo-dev-internal-key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.2 & 1.3 Microservicio de Carta, Productos y Órdenes (:8082)
  # ============================================================
  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    container_name: polleria-orders-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
      NOTIFICATION_URL: http://notification-service:3001
      NOTIFICATION_API_KEY: sanpollo-dev-notification-key
      # Clave interna entre microservicios. Sin ella el servicio falla cerrada (no hay default).
      INTERNAL_API_KEY: sanpollo-dev-internal-key
      # Inside docker the defaults (localhost) never reach these services.
      AUTH_SERVICE_URL: http://auth-service:8081
      INCIDENT_SERVICE_URL: http://incident-service:8088
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.4 Microservicio de Pagos (:8083)
  # ============================================================
  payments-service:
    build:
      context: .
      dockerfile: payments-service/Dockerfile
    container_name: polleria-payments-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
      ORDERS_SERVICE_URL: http://orders-service:8082
      NOTIFICATION_URL: http://notification-service:3001
      NOTIFICATION_API_KEY: sanpollo-dev-notification-key
      # Debe coincidir con el INTERNAL_API_KEY de orders-service.
      INTERNAL_API_KEY: sanpollo-dev-internal-key
      # Payment proofs bucket (same MinIO the notification-service uploads to).
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      orders-service:
        condition: service_started
    networks:
      - polleria-network

  # ============================================================
  # 1.5 Microservicio de Feedback y Reclamos (:8085)
  # ============================================================
  feedback-service:
    build:
      context: .
      dockerfile: feedback-service/Dockerfile
    container_name: polleria-feedback-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
      ORDERS_SERVICE_URL: http://orders-service:8082
      PAYMENTS_SERVICE_URL: http://payments-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      payments-service:
        condition: service_started
    networks:
      - polleria-network

  # ============================================================
  # 1.6 Microservicio de Inventario y Almacén (:8086)
  # ============================================================
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: polleria-inventory-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
      # Ghost-order resolution checks the order state in orders-service (fails closed without it).
      ORDERS_SERVICE_URL: http://orders-service:8082
      # Debe coincidir con el INTERNAL_API_KEY de orders-service.
      INTERNAL_API_KEY: sanpollo-dev-internal-key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.7 Microservicio de Finanzas y Caja (:8087)
  # ============================================================
  finance-service:
    build:
      context: .
      dockerfile: finance-service/Dockerfile
    container_name: polleria-finance-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.8 Microservicio de Incidentes y Resiliencia (:8088)
  # ============================================================
  incident-service:
    build:
      context: .
      dockerfile: incident-service/Dockerfile
    container_name: polleria-incident-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      PORT: 8088
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
      # orders-service reports ghost orders here with X-Internal-Key.
      INTERNAL_API_KEY: sanpollo-dev-internal-key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # Fase 3 - Almacenamiento de comprobantes de Yape (S7)
  # API S3: http://localhost:9000 · Consola: http://localhost:9001
  # Las credenciales salen de variables de entorno (defaults de desarrollo local).
  # ============================================================
  minio:
    # Pineada por digest (no por `latest`): la imagen que se está usando hoy es esta, y así el
    # entorno de pruebas no cambia bajo los pies por una actualización silenciosa de MinIO.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: polleria-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - polleria_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polleria-network

  # ============================================================
  # Fase 3 - Notificaciones WhatsApp (:3001)
  # Primer arranque: `docker logs -f polleria-notification-service` y escanear el QR
  # ============================================================
  notification-service:
    build:
      context: ./notification-service
    container_name: polleria-notification-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      TZ: America/Lima
      DATABASE_URL: postgres://postgres:postgres123@postgres:5432/polleria
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      NOTIFICATION_API_KEY: sanpollo-dev-notification-key
      WHATSAPP_RATE_LIMIT_MS: 10000
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
      # Dentro de la red del compose los servicios se alcanzan por nombre, no por localhost.
      # Sin estas dos URLs el bot de pedidos no puede leer la carta ni crear el pedido desde
      # el contenedor (defaults de localhost solo sirven corriendo desde el host).
      ORDERS_SERVICE_URL: http://orders-service:8082
      PAYMENTS_SERVICE_URL: http://payments-service:8083
      # Debe coincidir con el INTERNAL_API_KEY de orders-service y payments-service.
      INTERNAL_API_KEY: sanpollo-dev-internal-key
      # Almacenamiento de comprobantes de Yape (S7). Las credenciales son las del servicio minio.
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: polleria-comprobantes
    volumes:
      - polleria_whatsapp_session:/app/whatsapp-session
    shm_size: "1gb"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - polleria-network

volumes:
  polleria_postgres_data:
    name: polleria_local_postgres_data
  polleria_whatsapp_session:
    name: polleria_local_whatsapp_session
  polleria_minio_data:
    name: polleria_local_minio_data

networks:
  polleria-network:
    name: polleria_local_network
    driver: bridge
