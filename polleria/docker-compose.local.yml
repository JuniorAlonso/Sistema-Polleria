services:
  # ============================================================
  # Base de Datos PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: polleria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polleria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - polleria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polleria"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - polleria-network

  # ============================================================
  # Administrador Visual de BD (Opcional - http://localhost:5050)
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: polleria-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.1 Microservicio de Autenticación (:8081)
  # ============================================================
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: polleria-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
      MAX_FAILED_ATTEMPTS: 5
      BLOCK_DURATION_MINUTES: 15
      MAIL_USERNAME: ${MAIL_USERNAME:-mitrufely.dev@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-nxlktmlztrpuqudc}
      TWO_FACTOR_EXPIRY_MINUTES: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.2 & 1.3 Microservicio de Carta, Productos y Órdenes (:8082)
  # ============================================================
  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    container_name: polleria-orders-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polleria-network

  # ============================================================
  # 1.4 Microservicio de Pagos (:8083)
  # ============================================================
  payments-service:
    build:
      context: .
      dockerfile: payments-service/Dockerfile
    container_name: polleria-payments-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80,http://localhost
      ORDERS_SERVICE_URL: http://orders-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      orders-service:
        condition: service_started
    networks:
      - polleria-network

volumes:
  polleria_postgres_data:
    name: polleria_local_postgres_data

networks:
  polleria-network:
    name: polleria_local_network
    driver: bridge
