spring.application.name=payments-service
server.port=${PORT:8083}
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# =====================
# AWS RDS PostgreSQL
# =====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================
# JWT (mismo secreto que auth-service)
# =====================
jwt.secret=${JWT_SECRET:sanpollo-dev-secret-key-2026-super-segura-256bits-minimo}

# =====================
# CORS
# =====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =====================
# orders-service (para notificar estado de pago)
# =====================
orders.service.url=${ORDERS_SERVICE_URL:http://localhost:8082}
# Debe coincidir con internal.api-key de orders-service
orders.service.internal-key=${INTERNAL_API_KEY:polleria-dev-internal-key}

# =====================
# notification-service (WhatsApp, RF30)
# =====================
notification.service.url=${NOTIFICATION_URL:http://localhost:3001}
notification.service.internal-key=${NOTIFICATION_API_KEY:}
notification.whatsapp.tiempo-estimado=${WHATSAPP_TIEMPO_ESTIMADO:35-45 min}

# =====================
# Logs
# =====================
logging.level.com.sistema.polleria=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =====================
# Mercado Pago Checkout Pro
# =====================
# Sin valor por defecto la aplicación no arranca si la variable no está definida
# (PlaceholderResolutionException). MercadoPagoConfiguration ya maneja el token vacío
# registrando una advertencia, así que el default vacío es el comportamiento previsto.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:APP_USR-3ebe31db-22c8-4580-b9fa-3a827365b50c}
mercadopago.webhook.url=${MERCADOPAGO_WEBHOOK_URL:${MERCADOPAGO_NOTIFICATION_URL:}}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.sandbox=${MERCADOPAGO_SANDBOX:true}
mercadopago.back-urls.success=${MERCADOPAGO_SUCCESS_URL:http://3.237.70.97/checkout/success}
mercadopago.back-urls.failure=${MERCADOPAGO_FAILURE_URL:http://3.237.70.97/checkout/failure}
mercadopago.back-urls.pending=${MERCADOPAGO_PENDING_URL:http://3.237.70.97/checkout/pending}

spring.profiles.active=local