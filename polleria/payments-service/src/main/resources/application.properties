spring.application.name=payments-service
server.port=${PORT:8083}

# =====================
# AWS RDS PostgreSQL
# =====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================
# JWT (mismo secreto que auth-service)
# =====================
jwt.secret=${JWT_SECRET}

# =====================
# CORS
# =====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =====================
# orders-service (para notificar estado de pago)
# =====================
orders.service.url=${ORDERS_SERVICE_URL:http://localhost:8082}

# =====================
# Logs
# =====================
logging.level.com.sistema.polleria=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n



# =====================
# Mercado Pago Checkout Pro
# =====================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:APP_USR-2733300582350003-082916-7d60b458fb460f2ef2eb803852c0935e-3645988283}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:APP_USR-c425e605-dfe3-4ce3-bf50-aa60558e02b9}
mercadopago.webhook.url=${MERCADOPAGO_WEBHOOK_URL:}
mercadopago.back-urls.success=${MERCADOPAGO_SUCCESS_URL:http://localhost:4200/tracking}
mercadopago.back-urls.failure=${MERCADOPAGO_FAILURE_URL:http://localhost:4200/checkout?status=failure}
mercadopago.back-urls.pending=${MERCADOPAGO_PENDING_URL:http://localhost:4200/checkout?status=pending}

spring.profiles.active=local