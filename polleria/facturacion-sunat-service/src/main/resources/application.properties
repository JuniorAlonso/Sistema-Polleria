spring.application.name=facturacion-sunat-service
server.port=${PORT:8089}
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# =====================
# PostgreSQL (la misma base "polleria"; este servicio crea la tabla envios_sunat)
# =====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =====================
# JWT (mismo secreto que los demás servicios)
# =====================
jwt.secret=${JWT_SECRET}

# =====================
# CORS
# =====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}
app.cors.allow-loopback=${CORS_ALLOW_LOOPBACK:false}

# =====================
# Otros microservicios
# =====================
finance.service.url=${FINANCE_SERVICE_URL:http://localhost:8087}
orders.service.url=${ORDERS_SERVICE_URL:http://localhost:8082}

# =====================
# SUNAT — por defecto apunta al entorno BETA (pruebas, sin valor tributario)
# =====================
sunat.url=${SUNAT_URL:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
sunat.usuario-sol=${SUNAT_USUARIO_SOL:MODDATOS}
sunat.clave-sol=${SUNAT_CLAVE_SOL:moddatos}

# Certificado digital (.p12). En Cloud Run usa volumen secreto o SUNAT_CERT_BASE64; en local archivo .p12.
sunat.certificado.base64=${SUNAT_CERT_BASE64:}
sunat.certificado.ruta=${SUNAT_CERT_RUTA:./certificado/certificado-beta.p12}
sunat.certificado.password=${SUNAT_CERT_PASSWORD:}
sunat.firma.algoritmo=${SUNAT_FIRMA_ALGORITMO:SHA1}

# Datos de la pollería (emisor)
sunat.emisor.ruc=${SUNAT_RUC:20608945123}
sunat.emisor.razon-social=${SUNAT_RAZON_SOCIAL:POLLERIA SAN POLLO DE ICA S.A.C.}
sunat.emisor.nombre-comercial=${SUNAT_NOMBRE_COMERCIAL:POLLERIA SAN POLLO DE ICA}
sunat.emisor.direccion=${SUNAT_DIRECCION:AV. SAN MARTIN 456}
sunat.emisor.ubigeo=${SUNAT_UBIGEO:110101}
sunat.emisor.departamento=${SUNAT_DEPARTAMENTO:ICA}
sunat.emisor.provincia=${SUNAT_PROVINCIA:ICA}
sunat.emisor.distrito=${SUNAT_DISTRITO:ICA}

logging.level.com.sistema.polleria=INFO
logging.level.org.springframework.security=WARN
