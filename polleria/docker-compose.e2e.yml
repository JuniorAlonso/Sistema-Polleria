name: polleria-e2e

services:
  # ============================================================
  # Auth Service E2E (:18081)
  # ============================================================
  e2e-auth:
    image: polleria-auth-service:latest
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1:18081:8081"
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${E2E_POSTGRES_DB:?Defina E2E_POSTGRES_DB en .env.e2e}
      DB_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER en .env.e2e}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.e2e}
      JWT_SECRET: ${E2E_JWT_SECRET:?Defina E2E_JWT_SECRET en .env.e2e}
      JWT_EXPIRATION_MS: ${E2E_JWT_EXPIRATION_MS:-900000}
      CORS_ALLOWED_ORIGINS: ${E2E_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      APP_CORS_ALLOW_LOOPBACK: ${E2E_CORS_ALLOW_LOOPBACK:-true}
      MAX_FAILED_ATTEMPTS: 5
      BLOCK_DURATION_MINUTES: 15
      SPRING_MAIL_HOST: ${E2E_MAIL_HOST:-127.0.0.1}
      SPRING_MAIL_PORT: ${E2E_MAIL_PORT:-1}
      MAIL_USERNAME: ${E2E_MAIL_USERNAME:-}
      MAIL_PASSWORD: ${E2E_MAIL_PASSWORD:-}
      TWO_FACTOR_EXPIRY_MINUTES: 5
      INTERNAL_API_KEY: ${E2E_INTERNAL_API_KEY:?Defina E2E_INTERNAL_API_KEY en .env.e2e}
    networks:
      - e2e-internal
      - polleria_local_network

  # ============================================================
  # Orders Service E2E (:18082) - Reutiliza imagen A1/A2.1
  # ============================================================
  e2e-orders:
    image: polleria-orders-service:latest
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1:18082:8082"
    environment:
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/${E2E_POSTGRES_DB:?Defina E2E_POSTGRES_DB en .env.e2e}
      DB_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER en .env.e2e}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.e2e}
      JWT_SECRET: ${E2E_JWT_SECRET:?Defina E2E_JWT_SECRET en .env.e2e}
      CORS_ALLOWED_ORIGINS: ${E2E_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      CORS_ALLOW_LOOPBACK: ${E2E_CORS_ALLOW_LOOPBACK:-true}
      NOTIFICATION_URL: ${E2E_NOTIFICATION_URL:-http://127.0.0.1:1}
      NOTIFICATION_API_KEY: ${E2E_NOTIFICATION_API_KEY:-e2e-disabled-notification-key}
      INTERNAL_API_KEY: ${E2E_INTERNAL_API_KEY:?Defina E2E_INTERNAL_API_KEY en .env.e2e}
      AUTH_SERVICE_URL: http://e2e-auth:8081
      PAYMENTS_SERVICE_URL: http://e2e-payments:8083
      INCIDENT_SERVICE_URL: http://127.0.0.1:1
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env.e2e}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env.e2e}
      MINIO_BUCKET_CATALOGO: ${E2E_MINIO_BUCKET_CATALOGO:?Defina E2E_MINIO_BUCKET_CATALOGO en .env.e2e}
    depends_on:
      e2e-auth:
        condition: service_healthy
    networks:
      - e2e-internal
      - polleria_local_network

  # ============================================================
  # Payments Service E2E (:18083) - Reutiliza imagen A2
  # ============================================================
  e2e-payments:
    image: polleria-payments-service:latest
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1:18083:8083"
    environment:
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/${E2E_POSTGRES_DB:?Defina E2E_POSTGRES_DB en .env.e2e}
      DB_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER en .env.e2e}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.e2e}
      JWT_SECRET: ${E2E_JWT_SECRET:?Defina E2E_JWT_SECRET en .env.e2e}
      CORS_ALLOWED_ORIGINS: ${E2E_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      APP_CORS_ALLOW_LOOPBACK: ${E2E_CORS_ALLOW_LOOPBACK:-true}
      ORDERS_SERVICE_URL: http://e2e-orders:8082
      FINANCE_SERVICE_URL: http://e2e-finance:8087
      NOTIFICATION_URL: ${E2E_NOTIFICATION_URL:-http://127.0.0.1:1}
      NOTIFICATION_API_KEY: ${E2E_NOTIFICATION_API_KEY:-e2e-disabled-notification-key}
      MERCADOPAGO_ACCESS_TOKEN: ${E2E_MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${E2E_MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_SANDBOX: ${E2E_MERCADOPAGO_SANDBOX:-true}
      PAYMENTS_MOCK_GATEWAYS_ENABLED: ${E2E_PAYMENTS_MOCK_GATEWAYS_ENABLED:-true}
      PAYMENTS_YAPE_OTP_MOCK_ENABLED: ${E2E_PAYMENTS_YAPE_OTP_MOCK_ENABLED:-true}
      INTERNAL_API_KEY: ${E2E_INTERNAL_API_KEY:?Defina E2E_INTERNAL_API_KEY en .env.e2e}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 9000
      MINIO_PUBLIC_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env.e2e}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env.e2e}
      MINIO_BUCKET: ${E2E_MINIO_BUCKET_COMPROBANTES:?Defina E2E_MINIO_BUCKET_COMPROBANTES en .env.e2e}
    depends_on:
      e2e-orders:
        condition: service_healthy
    networks:
      - e2e-internal
      - polleria_local_network

  # ============================================================
  # Finance Service E2E (:18087)
  # ============================================================
  e2e-finance:
    image: polleria-finance-service:latest
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1:18087:8087"
    environment:
      PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/${E2E_POSTGRES_DB:?Defina E2E_POSTGRES_DB en .env.e2e}
      DB_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER en .env.e2e}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.e2e}
      JWT_SECRET: ${E2E_JWT_SECRET:?Defina E2E_JWT_SECRET en .env.e2e}
      CORS_ALLOWED_ORIGINS: ${E2E_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      CORS_ALLOW_LOOPBACK: ${E2E_CORS_ALLOW_LOOPBACK:-true}
      ORDERS_SERVICE_URL: http://e2e-orders:8082
      PAYMENTS_SERVICE_URL: http://e2e-payments:8083
      INTERNAL_API_KEY: ${E2E_INTERNAL_API_KEY:?Defina E2E_INTERNAL_API_KEY en .env.e2e}
    depends_on:
      e2e-orders:
        condition: service_healthy
      e2e-payments:
        condition: service_healthy
    networks:
      - e2e-internal
      - polleria_local_network

networks:
  e2e-internal:
    name: polleria_e2e_internal
    driver: bridge
    internal: true
  polleria_local_network:
    external: true
