spring.application.name=feedback-service
server.port=${PORT:8085}
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# =====================
# PostgreSQL Database
# =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/polleria}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================
# JWT (mismo secreto compartido)
# =====================
# Sin valor por defecto a proposito: si JWT_SECRET falta en el despliegue, el servicio
# NO arranca. Un default publico permitiria a cualquiera firmar un token ADMIN.
jwt.secret=${JWT_SECRET}

# =====================
# CORS
# =====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}

# =====================
# Multipart / Subida de Archivos
# =====================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =====================
# MinIO (almacenamiento de evidencias)
# =====================
minio.endpoint=${MINIO_ENDPOINT:localhost}
minio.port=${MINIO_PORT:9000}
minio.use-ssl=${MINIO_USE_SSL:false}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.feedback=${MINIO_BUCKET_FEEDBACK:polleria-feedback}

# =====================
# Inter-Service URLs
# =====================
orders.service.url=${ORDERS_SERVICE_URL:http://localhost:8082}
payments.service.url=${PAYMENTS_SERVICE_URL:http://localhost:8083}
finance.service.url=${FINANCE_SERVICE_URL:http://localhost:8087}
internal.api-key=${INTERNAL_API_KEY:}

# =====================
# Logging
# =====================
logging.level.com.sistema.polleria=INFO
logging.level.org.springframework.security=WARN
