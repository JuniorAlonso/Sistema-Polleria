# =====================
# Perfil de pruebas — PostgreSQL aislado en Docker
# Requiere: docker compose -f docker-compose.local.yml up -d postgres
# Puerto 5433: en Windows, 127.0.0.1:5432 suele estar ocupado por otro PostgreSQL.
# Base dedicada: el esquema se recrea en cada ejecución.
# =====================
spring.datasource.url=jdbc:postgresql://localhost:5433/polleria_test
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Clave de firma de pruebas: los tests firman sus propios tokens con este mismo secreto.
jwt.secret=sanpollo-dev-secret-key-2026-super-segura-256bits-minimo
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

cors.allowed-origins=http://localhost:4200

security.max-failed-attempts=5
security.block-duration-minutes=15
security.two-factor.code-expiry-minutes=5

# Evita credenciales reales de SMTP durante las pruebas
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pruebas@yopmail.com
spring.mail.password=clave-de-pruebas

logging.level.com.sistema.polleria=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
