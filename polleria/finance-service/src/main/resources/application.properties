spring.application.name=finance-service
server.port=${PORT:8087}

# =====================
# PostgreSQL Database
# =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/polleria}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================
# JWT (mismo secreto compartido)
# =====================
jwt.secret=${JWT_SECRET:sanpollo-dev-secret-key-2026-super-segura-256bits-minimo}

# =====================
# CORS
# =====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}

# =====================
# Inter-Service URLs
# =====================
orders.service.url=${ORDERS_SERVICE_URL:http://localhost:8082}
payments.service.url=${PAYMENTS_SERVICE_URL:http://localhost:8083}

# =====================
# Logging
# =====================
logging.level.com.sistema.polleria=INFO
logging.level.org.springframework.security=WARN
