spring.application.name=inventory-service
server.port=${PORT:8086}
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# =====================
# PostgreSQL Database
# =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/polleria}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================
# JWT (mismo secreto compartido)
# =====================
# Sin valor por defecto a proposito: si JWT_SECRET falta en el despliegue, el servicio
# NO arranca. Un default publico permitiria a cualquiera firmar un token ADMIN.
jwt.secret=${JWT_SECRET}

# =====================
# CORS
# =====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}

# =====================
# Logging
# =====================
logging.level.com.sistema.polleria=INFO
logging.level.org.springframework.security=WARN
