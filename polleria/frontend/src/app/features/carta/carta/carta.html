<div class="carta-container">
  <h1 class="page-title">🍗 Nuestra Carta</h1>

  @if (loading()) {
    <div class="loading-container">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else {
    <mat-tab-group animationDuration="200ms" dynamicHeight>
      @for (cat of categorias(); track cat.nombre) {
        <mat-tab [label]="cat.label">
          @if (cat.productos.length === 0) {
            <p class="empty-category">No hay productos disponibles en esta categoría.</p>
          } @else {
            <div class="productos-grid">
              @for (producto of cat.productos; track producto.id) {
                <app-producto-card
                  [producto]="producto"
                  (agregar)="agregarAlCarrito($event)"
                ></app-producto-card>
              }
            </div>
          }
        </mat-tab>
      }
    </mat-tab-group>
  }
</div>

<!-- Botón flotante del carrito -->
@if (totalItems() > 0) {
  <div class="cart-fab">
    <button
      mat-fab
      extended
      color="accent"
      (click)="verCarrito()"
      [matBadge]="totalItems()"
      matBadgeColor="warn"
    >
      <mat-icon>shopping_cart</mat-icon>
      Ver Pedido
      <span class="cart-total">S/ {{ totalPrice() | number:'1.2-2' }}</span>
    </button>
  </div>
}
