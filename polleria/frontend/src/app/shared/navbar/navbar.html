<mat-toolbar color="primary">
  <a class="logo" routerLink="/carta">🍗 Pollería</a>

  <!-- Link visible para todos -->
  <a
    mat-button
    class="nav-link"
    routerLink="/carta"
    routerLinkActive="active-link"
  >Carta</a>

  <!-- Solo CLIENTE -->
  @if (showCliente()) {
    <a
      mat-button
      class="nav-link"
      routerLink="/mis-pedidos"
      routerLinkActive="active-link"
    >Mis Pedidos</a>
    <a
      mat-button
      class="nav-link"
      routerLink="/pedido"
      routerLinkActive="active-link"
    >Nuevo Pedido</a>
  }

  <!-- MOZO o ADMIN -->
  @if (showMozoAdmin()) {
    <a
      mat-button
      class="nav-link"
      routerLink="/mesas"
      routerLinkActive="active-link"
    >Mesas</a>
    <a
      mat-button
      class="nav-link"
      [routerLink]="role() === 'ADMIN' ? '/admin' : '/mozo'"
      routerLinkActive="active-link"
    >Panel</a>
  }

  <!-- COCINA o ADMIN -->
  @if (showCocinaAdmin()) {
    <a
      mat-button
      class="nav-link"
      routerLink="/cocina"
      routerLinkActive="active-link"
    >Cocina</a>
  }

  <!-- Solo ADMIN -->
  @if (showAdmin()) {
    <a
      mat-button
      class="nav-link"
      routerLink="/admin/productos"
      routerLinkActive="active-link"
    >Productos</a>
  }

  <span class="spacer"></span>

  @if (isAuthenticated()) {
    <span class="user-name">{{ userName() }}</span>
    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      Salir
    </button>
  } @else {
    <a mat-button class="nav-link" routerLink="/login">Login</a>
    <a mat-button class="nav-link" routerLink="/register">Registro</a>
  }
</mat-toolbar>
